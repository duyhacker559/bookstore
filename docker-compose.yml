name: store

services:
  # MySQL Database (for Django monolith migration target)
  mysql:
    image: mysql:8.0
    container_name: store-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-store}
      MYSQL_USER: ${MYSQL_USER:-store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-store_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-store} -p${MYSQL_PASSWORD:-store_password}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # PostgreSQL Database (shared)
  postgres:
    image: postgres:14
    container_name: store-postgres
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore_password
      POSTGRES_DB: bookstore
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: store-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Monolith
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_DB_ENGINE=${DJANGO_DB_ENGINE:-sqlite3}
      - SQLITE_PATH=${SQLITE_PATH:-/app/db.sqlite3}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-store}
      - MYSQL_USER=${MYSQL_USER:-store}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-store_password}
      - MYSQL_CONN_MAX_AGE=${MYSQL_CONN_MAX_AGE:-60}
      - PAYMENT_SERVICE_URL=http://payment-service:5000
      - PAYMENT_SERVICE_TOKEN=payment-service-token-123
      - SHIPPING_SERVICE_URL=http://shipping-service:5001
      - SHIPPING_SERVICE_TOKEN=shipping-service-token-123
      - AI_SERVICE_URL=http://ai-service:5006
      - AI_SERVICE_TOKEN=ai-service-token-123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Payment Service (FastAPI)
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: store-payment-service
    command: uvicorn app:app --host 0.0.0.0 --port 5000 --reload
    volumes:
      - ./payment-service:/app
    ports:
      - "5000:5000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://bookstore:bookstore_password@postgres:5432/payment_service
      - STRIPE_SECRET_KEY=sk_test_demo
      - STRIPE_PUBLISHABLE_KEY=pk_test_demo
      - PAYMENT_SERVICE_TOKEN=payment-service-token-123
      - MONOLITH_URL=http://web:8000
      - MONOLITH_TOKEN=payment-service-token-123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Shipping Service (FastAPI)
  shipping-service:
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    container_name: store-shipping-service
    command: uvicorn app:app --host 0.0.0.0 --port 5001 --reload
    volumes:
      - ./shipping-service:/app
    ports:
      - "5001:5001"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://bookstore:bookstore_password@postgres:5432/shipping_service
      - SHIPPING_SERVICE_TOKEN=shipping-service-token-123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notification Service (FastAPI)
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: store-notification-service
    command: uvicorn app:app --host 0.0.0.0 --port 5002 --reload
    volumes:
      - ./notification-service:/app
    ports:
      - "5002:5002"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://bookstore:bookstore_password@postgres:5432/notification_service
      - NOTIFICATION_SERVICE_TOKEN=notification-service-token-123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - FROM_EMAIL=noreply@bookstore.local
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Neo4j for AI Service
  neo4j:
    image: neo4j:5.24-community
    container_name: store-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_password 'RETURN 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # AI Service (FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: store-ai-service
    command: uvicorn app:app --host 0.0.0.0 --port 5006 --reload
    volumes:
      - ./ai-service:/app
    ports:
      - "5006:5006"
    environment:
      - DEBUG=True
      - AUTH_TOKEN=ai-service-token-123
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j_password
      - NEO4J_DATABASE=neo4j
      - LOG_LEVEL=INFO
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  postgres_data:
  rabbitmq_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:

networks:
  default:
    name: store-network
