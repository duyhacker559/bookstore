name: store

services:
  # MySQL Database (for Django monolith migration target)
  mysql:
    image: mysql:8.0
    container_name: store-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-store}
      MYSQL_USER: ${MYSQL_USER:-store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-store_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-store} -p${MYSQL_PASSWORD:-store_password}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # PostgreSQL Database (shared)
  postgres:
    image: postgres:14
    container_name: store-postgres
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore_password
      POSTGRES_DB: bookstore
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: store-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Monolith
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_DB_ENGINE=${DJANGO_DB_ENGINE:-sqlite3}
      - SQLITE_PATH=${SQLITE_PATH:-/app/db.sqlite3}
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-store}
      - MYSQL_USER=${MYSQL_USER:-store}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-store_password}
      - MYSQL_CONN_MAX_AGE=${MYSQL_CONN_MAX_AGE:-60}
      - PAYMENT_SERVICE_URL=http://payment-service:5000
      - PAYMENT_SERVICE_TOKEN=payment-service-token-123
      - SHIPPING_SERVICE_URL=http://shipping-service:5001
      - SHIPPING_SERVICE_TOKEN=shipping-service-token-123
      - BEHAVIOR_SERVICE_URL=http://behavior-service:5004
      - BEHAVIOR_SERVICE_TOKEN=behavior-service-token-123
      - RAG_SERVICE_URL=http://rag-service:5005
      - RAG_SERVICE_TOKEN=rag-service-token-123
      - AI_BEHAVIOR_SERVICE_URL=http://ai-behavior-service:5006
      - AI_BEHAVIOR_SERVICE_TOKEN=ai-behavior-service-token-123
      - AI_ADVANCED_WIDGET_ENABLED=${AI_ADVANCED_WIDGET_ENABLED:-False}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Payment Service (FastAPI)
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: store-payment-service
    command: uvicorn app:app --host 0.0.0.0 --port 5000 --reload
    volumes:
      - ./payment-service:/app
    ports:
      - "5000:5000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://bookstore:bookstore_password@postgres:5432/payment_service
      - STRIPE_SECRET_KEY=sk_test_demo
      - STRIPE_PUBLISHABLE_KEY=pk_test_demo
      - PAYMENT_SERVICE_TOKEN=payment-service-token-123
      - MONOLITH_URL=http://web:8000
      - MONOLITH_TOKEN=payment-service-token-123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Shipping Service (FastAPI)
  shipping-service:
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    container_name: store-shipping-service
    command: uvicorn app:app --host 0.0.0.0 --port 5001 --reload
    volumes:
      - ./shipping-service:/app
    ports:
      - "5001:5001"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://bookstore:bookstore_password@postgres:5432/shipping_service
      - SHIPPING_SERVICE_TOKEN=shipping-service-token-123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notification Service (FastAPI)
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: store-notification-service
    command: uvicorn app:app --host 0.0.0.0 --port 5002 --reload
    volumes:
      - ./notification-service:/app
    ports:
      - "5002:5002"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://bookstore:bookstore_password@postgres:5432/notification_service
      - NOTIFICATION_SERVICE_TOKEN=notification-service-token-123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - FROM_EMAIL=noreply@bookstore.local
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Behavior Service (FastAPI)
  behavior-service:
    build:
      context: ./behavior-service
      dockerfile: Dockerfile
    container_name: store-behavior-service
    command: uvicorn app:app --host 0.0.0.0 --port 5004 --reload
    volumes:
      - ./behavior-service:/app
    ports:
      - "5004:5004"
    environment:
      - DEBUG=True
      - BEHAVIOR_SERVICE_TOKEN=behavior-service-token-123
      - BEHAVIOR_TRAIN_DATA_PATH=/app/data/vi_behavior_lexicon.json
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RAG Service (FastAPI)
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: store-rag-service
    command: uvicorn app:app --host 0.0.0.0 --port 5005 --reload
    volumes:
      - ./rag-service:/app
    ports:
      - "5005:5005"
    environment:
      - DEBUG=True
      - RAG_SERVICE_TOKEN=rag-service-token-123
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flask}
      - GEMINI_API_VERSION=${GEMINI_API_VERSION:-v1beta}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Behavior Service (FastAPI)
  ai-behavior-service:
    build:
      context: ./ai-customer-behavior/service
      dockerfile: Dockerfile
    container_name: store-ai-behavior-service
    command: uvicorn app:app --host 0.0.0.0 --port 5006 --reload
    volumes:
      - ./ai-customer-behavior/service:/app
    ports:
      - "5006:5006"
    environment:
      - DEBUG=True
      - AI_BEHAVIOR_SERVICE_TOKEN=ai-behavior-service-token-123
      - AI_BEHAVIOR_DB_PATH=/app/data/behavior_events.db
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_API_VERSION=${GEMINI_API_VERSION:-v1beta}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  postgres_data:
  rabbitmq_data:

networks:
  default:
    name: store-network
